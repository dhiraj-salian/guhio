<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guhio Vault</title>
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon.ico') }}">
    <style>
        :root {
            --bg: #f8f9fa;
            --fg: #212529;
            --muted: #6c757d;
            --accent: #0284c7;
            --accent-hover: #0369a1;
            --accent-deep: #075985;
            --accent-soft: #e0f2fe;
            --danger: #dc2626;
            --danger-hover: #b91c1c;
            --danger-soft: #fee2e2;
            --border: #dee2e6;
            --card: #ffffff;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
            --shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.08);
            --shadow-xl: 0 25px 50px -12px rgba(0, 0, 0, 0.12);
            --radius: 1rem;
            --radius-sm: 0.625rem;
            --space-xs: 0.5rem;
            --space-sm: 0.75rem;
            --space-md: 1rem;
            --space-lg: 1.5rem;
            --space-xl: 2.5rem;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0f172a;
                --fg: #f8fafc;
                --muted: #94a3b8;
                --accent: #38bdf8;
                --accent-hover: #7dd3fc;
                --accent-deep: #0ea5e9;
                --accent-soft: #0c4a6e;
                --danger: #f87171;
                --danger-hover: #fca5a5;
                --danger-soft: #450a0a;
                --border: #334155;
                --card: #1e293b;
                --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.25), 0 2px 4px -2px rgba(0, 0, 0, 0.2);
                --shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.25);
                --shadow-xl: 0 25px 50px -12px rgba(0, 0, 0, 0.45);
            }
        }

        * { box-sizing: border-box; }

        html { -webkit-text-size-adjust: 100%; }

        body {
            font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: var(--bg);
            background-image: radial-gradient(circle at 10% 0%, var(--accent-soft) 0%, transparent 35%), radial-gradient(circle at 90% 100%, var(--accent-soft) 0%, transparent 30%);
            color: var(--fg);
            margin: 0;
            padding: var(--space-md);
            line-height: 1.65;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .container {
            max-width: 100%;
            margin: 0 auto;
        }

        @media (min-width: 640px) {
            body { padding: var(--space-xl); }
            .container { max-width: 760px; }
        }

        @media (min-width: 1024px) {
            .container { max-width: 980px; }
        }

        .brand {
            display: flex;
            align-items: center;
            gap: var(--space-md);
            margin-bottom: var(--space-sm);
        }

        .brand img {
            width: 64px;
            height: 64px;
            flex-shrink: 0;
        }

        @media (min-width: 640px) {
            .brand img { width: 88px; height: 88px; }
        }

        .brand h1 {
            margin: 0;
            font-size: 2rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            line-height: 1.1;
            color: var(--fg);
        }

        .brand h1 span {
            color: var(--accent);
        }

        @media (min-width: 640px) {
            .brand h1 { font-size: 2.5rem; }
        }

        .lead {
            color: var(--muted);
            margin: 0 0 var(--space-xl) 0;
            font-size: 1rem;
            line-height: 1.6;
        }

        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: var(--space-xl);
            margin-bottom: var(--space-lg);
            box-shadow: var(--shadow-lg);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        @media (min-width: 640px) {
            .card { padding: var(--space-xl); }
        }

        .card-header {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: var(--space-sm);
            margin-bottom: var(--space-lg);
        }

        @media (min-width: 640px) {
            .card-header {
                flex-direction: row;
                justify-content: space-between;
                align-items: center;
            }
        }

        .card-title {
            margin: 0;
            font-size: 1.375rem;
            font-weight: 700;
            letter-spacing: -0.01em;
        }

        .section-title {
            margin: var(--space-xl) 0 var(--space-md) 0;
            font-size: 0.9375rem;
            font-weight: 700;
            letter-spacing: 0.02em;
            text-transform: uppercase;
            color: var(--muted);
        }

        .section-title:first-child { margin-top: 0; }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: var(--space-sm);
            margin-bottom: var(--space-md);
        }

        @media (min-width: 640px) {
            .form-group.form-row {
                flex-direction: row;
                align-items: flex-end;
            }

            .form-group.form-row > * { flex: 1; }
            .form-group.form-row > .btn { flex: 0 0 auto; }
        }

        label {
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--fg);
        }

        input[type="password"],
        input[type="text"] {
            width: 100%;
            min-height: 48px;
            padding: var(--space-sm) var(--space-md);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 1rem;
            background: var(--card);
            color: var(--fg);
            box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.04);
            transition: border-color 0.15s ease, box-shadow 0.15s ease, transform 0.1s ease;
        }

        input[type="password"]:focus,
        input[type="text"]:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.04), 0 0 0 4px var(--accent-soft);
            transform: translateY(-1px);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 48px;
            padding: var(--space-sm) var(--space-lg);
            border: none;
            border-radius: var(--radius-sm);
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.15s ease, transform 0.1s ease, box-shadow 0.15s ease;
            white-space: nowrap;
            touch-action: manipulation;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.08);
        }

        .btn:active { transform: translateY(1px); }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent) 0%, var(--accent-hover) 100%);
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.25);
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, var(--accent-hover) 0%, var(--accent-deep) 100%);
            box-shadow: 0 6px 16px rgba(2, 132, 199, 0.35);
            transform: translateY(-1px);
        }

        @media (prefers-color-scheme: dark) {
            .btn-primary:hover {
                box-shadow: 0 6px 16px rgba(56, 189, 248, 0.25);
            }
        }

        .btn-danger {
            background: var(--danger-soft);
            color: var(--danger);
        }

        .btn-danger:hover {
            background: var(--danger);
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(220, 38, 38, 0.2);
            transform: translateY(-1px);
        }

        .btn-sm {
            min-height: 38px;
            padding: var(--space-xs) var(--space-md);
            font-size: 0.875rem;
        }

        .message {
            padding: var(--space-md);
            border-radius: var(--radius-sm);
            margin-bottom: var(--space-md);
            display: none;
            font-size: 0.95rem;
        }

        .message.error {
            display: block;
            background: var(--danger-soft);
            color: var(--danger);
        }

        .message.success {
            display: block;
            background: #dcfce7;
            color: #166534;
        }

        @media (prefers-color-scheme: dark) {
            .message.success {
                background: #064e3b;
                color: #86efac;
            }
        }

        .empty-state {
            text-align: center;
            padding: var(--space-xl) var(--space-md);
            color: var(--muted);
            background: var(--accent-soft);
            border-radius: var(--radius);
            border: 1px dashed var(--border);
        }

        .empty-state-icon {
            font-size: 3rem;
            margin-bottom: var(--space-sm);
            opacity: 0.7;
        }

        .credentials-list {
            list-style: none;
            margin: 0;
            padding: 0;
            display: grid;
            gap: var(--space-sm);
        }

        .credential-card {
            display: grid;
            gap: var(--space-sm);
            padding: var(--space-md);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            background: var(--card);
            box-shadow: var(--shadow);
            transition: box-shadow 0.15s ease, transform 0.15s ease;
        }

        .credential-card:hover {
            box-shadow: var(--shadow-lg);
            transform: translateY(-2px);
        }

        @media (min-width: 640px) {
            .credential-card {
                grid-template-columns: 1fr auto auto;
                align-items: center;
            }
        }

        .credential-name {
            font-weight: 600;
            word-break: break-word;
        }

        .credential-meta {
            font-size: 0.875rem;
            color: var(--muted);
        }

        .credentials-table {
            display: none;
            width: 100%;
            border-collapse: collapse;
        }

        @media (min-width: 640px) {
            .credentials-table { display: table; }
            .credentials-list { display: none; }
        }

        .credentials-table th,
        .credentials-table td {
            text-align: left;
            padding: var(--space-md);
            border-bottom: 1px solid var(--border);
            vertical-align: middle;
        }

        .credentials-table th {
            font-weight: 600;
            font-size: 0.875rem;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.025em;
        }

        .credentials-table td:last-child,
        .credentials-table th:last-child { text-align: right; }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="brand">
            <img src="{{ url_for('static', filename='logo.svg') }}" alt="">
            <h1>Guh<span>io</span></h1>
        </div>
        <p class="lead">A secure, local credential store for your workflows. This dashboard is available only on your machine.</p>

        <div id="message" class="message" role="status" aria-live="polite"></div>

        <div id="unlock-section" class="card" style="display: none;">
            <div class="card-header">
                <h2 class="card-title">Unlock your vault</h2>
            </div>
            <div class="form-group form-row">
                <div>
                    <label for="master-password">Master password</label>
                    <input type="password" id="master-password" placeholder="Type your master password" autocomplete="off" aria-required="true">
                </div>
                <button class="btn btn-primary" onclick="unlock()">Unlock</button>
            </div>
        </div>

        <div id="vault-section" class="card" style="display: none;">
            <div class="card-header">
                <h2 class="card-title">Credentials</h2>
                <button class="btn btn-danger btn-sm" onclick="lock()">Lock</button>
            </div>

            <h3 class="section-title">Add a credential</h3>
            <div class="form-group form-row">
                <div>
                    <label for="credential-name">Name</label>
                    <input type="text" id="credential-name" placeholder="e.g. github" aria-required="true">
                </div>
                <div>
                    <label for="credential-value">Secret</label>
                    <input type="password" id="credential-value" placeholder="Enter the secret value" aria-required="true">
                </div>
                <button class="btn btn-primary" onclick="addCredential()">Save</button>
            </div>

            <h3 class="section-title">Saved credentials</h3>
            <div id="credentials-container">
                <table class="credentials-table" id="credentials-table" aria-label="Stored credentials">
                    <thead>
                        <tr>
                            <th scope="col">Name</th>
                            <th scope="col">Created</th>
                            <th scope="col"><span class="sr-only">Actions</span></th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
                <ul id="credentials-list" class="credentials-list" aria-label="Stored credentials"></ul>
                <div id="empty-state" class="empty-state" style="display: none;">
                    <div class="empty-state-icon" aria-hidden="true">🛡️</div>
                    <p>Your vault is empty. Add your first credential above.</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        async function api(path, options = {}) {
            const res = await fetch(path, {
                headers: { 'Content-Type': 'application/json' },
                ...options,
            });
            const data = res.status !== 204 ? await res.json().catch(() => ({})) : {};
            if (!res.ok) {
                throw new Error(data.error || `HTTP ${res.status}`);
            }
            return data;
        }

        function showMessage(text, isError) {
            const el = document.getElementById('message');
            el.textContent = text;
            el.className = 'message ' + (isError ? 'error' : 'success');
            setTimeout(() => el.className = 'message', 4000);
        }

        async function refreshStatus() {
            const status = await api('/api/status');
            document.getElementById('unlock-section').style.display = status.unlocked ? 'none' : 'block';
            document.getElementById('vault-section').style.display = status.unlocked ? 'block' : 'none';
            if (status.unlocked) await loadCredentials();
        }

        async function unlock() {
            const password = document.getElementById('master-password').value;
            try {
                await api('/api/unlock', { method: 'POST', body: JSON.stringify({ password }) });
                document.getElementById('master-password').value = '';
                await refreshStatus();
            } catch (err) {
                showMessage(err.message, true);
            }
        }

        async function lock() {
            try {
                await api('/api/lock', { method: 'POST' });
                await refreshStatus();
            } catch (err) {
                showMessage(err.message, true);
            }
        }

        function createRemoveButton(name) {
            const btn = document.createElement('button');
            btn.className = 'btn btn-danger btn-sm';
            btn.textContent = 'Remove';
            btn.setAttribute('aria-label', `Remove credential ${name}`);
            btn.addEventListener('click', () => removeCredential(name));
            return btn;
        }

        async function loadCredentials() {
            try {
                const credentials = await api('/api/credentials');
                const tbody = document.querySelector('#credentials-table tbody');
                const list = document.getElementById('credentials-list');
                tbody.innerHTML = '';
                list.innerHTML = '';

                if (credentials.length === 0) {
                    document.getElementById('empty-state').style.display = 'block';
                    document.getElementById('credentials-table').style.display = 'none';
                    document.getElementById('credentials-list').style.display = 'none';
                } else {
                    document.getElementById('empty-state').style.display = 'none';

                    for (const cred of credentials) {
                        const createdText = new Date(cred.created_at).toLocaleString();

                        const tr = document.createElement('tr');

                        const tdName = document.createElement('td');
                        tdName.textContent = cred.name;
                        tr.appendChild(tdName);

                        const tdCreated = document.createElement('td');
                        tdCreated.textContent = createdText;
                        tr.appendChild(tdCreated);

                        const tdAction = document.createElement('td');
                        tdAction.appendChild(createRemoveButton(cred.name));
                        tr.appendChild(tdAction);

                        tbody.appendChild(tr);

                        const li = document.createElement('li');
                        li.className = 'credential-card';

                        const nameDiv = document.createElement('div');
                        nameDiv.className = 'credential-name';
                        nameDiv.textContent = cred.name;
                        li.appendChild(nameDiv);

                        const metaDiv = document.createElement('div');
                        metaDiv.className = 'credential-meta';
                        metaDiv.textContent = createdText;
                        li.appendChild(metaDiv);

                        const actionDiv = document.createElement('div');
                        actionDiv.appendChild(createRemoveButton(cred.name));
                        li.appendChild(actionDiv);

                        list.appendChild(li);
                    }

                    const isDesktop = window.matchMedia('(min-width: 640px)').matches;
                    document.getElementById('credentials-table').style.display = isDesktop ? 'table' : 'none';
                    document.getElementById('credentials-list').style.display = isDesktop ? 'none' : 'block';
                }
            } catch (err) {
                showMessage(err.message, true);
            }
        }

        function handleResize() {
            const hasCredentials = document.querySelector('#credentials-table tbody').children.length > 0;
            if (!hasCredentials) return;
            const isDesktop = window.matchMedia('(min-width: 640px)').matches;
            document.getElementById('credentials-table').style.display = isDesktop ? 'table' : 'none';
            document.getElementById('credentials-list').style.display = isDesktop ? 'none' : 'block';
        }

        window.addEventListener('resize', handleResize);

        async function addCredential() {
            const name = document.getElementById('credential-name').value.trim();
            const value = document.getElementById('credential-value').value;
            if (!name || !value) {
                showMessage('Name and value are required', true);
                return;
            }
            try {
                await api('/api/credentials', { method: 'POST', body: JSON.stringify({ name, value }) });
                document.getElementById('credential-name').value = '';
                document.getElementById('credential-value').value = '';
                await loadCredentials();
                showMessage('Credential saved', false);
            } catch (err) {
                showMessage(err.message, true);
            }
        }

        async function removeCredential(name) {
            if (!confirm(`Remove credential "${name}"?`)) return;
            try {
                await api(`/api/credentials/${encodeURIComponent(name)}`, { method: 'DELETE' });
                await loadCredentials();
                showMessage('Credential deleted', false);
            } catch (err) {
                showMessage(err.message, true);
            }
        }

        refreshStatus();
    </script>
</body>
</html>
